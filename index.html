<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Protótipo de Acessibilidade</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>Sistema de Acessibilidade</h1>

    <div class="controls">
      <button id="btn-pir">Simular Movimento (PIR)</button>
      <label>
        <input type="checkbox" id="usar-motor" checked> Usar Motor
      </label>
    </div>

    <div class="hardware-view">
      <div class="component">
        <span>LED 1</span>
        <div id="led1" class="led"></div>
      </div>
      <div class="component">
        <span>LED 2</span>
        <div id="led2" class="led"></div>
      </div>
      <div class="component">
        <span>Motor DC</span>
        <div id="motor" class="motor"></div>
      </div>
    </div>

    <div class="terminal">
      <h3>Monitor Serial</h3>
      <div id="serial-log">=================================<br>Sistema de Acessibilidade<br>Aguardando movimento...<br>=================================<br></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
